<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall</title>
    <style>
        body {
            background-color: #18181f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            position: relative;
        }
        .container {
            width: 410px;
            background-color: #22222b;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 35px 25px 25px 25px;
            box-sizing: border-box;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo {
            width: 75px;
            height: 75px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .logo-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 22px;
            transition: all 0.3s ease;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: #b3b3b9;
        }
        .input-group input {
            width: 100%;
            padding: 11px;
            background-color: #18181f !important;
            border: 1px solid #33333d;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 1rem;
            box-sizing: border-box;
            -webkit-text-fill-color: #ffffff;
        }
        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover, 
        .input-group input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px #18181f inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        .input-group input:focus {
            outline: none;
            border-color: #555566;
            background-color: #18181f !important;
        }
        .input-group input.error {
            border-color: #f93b3b;
        }
        .input-group input.success {
            border-color: #3bf973;
        }
        .status-msg {
            position: absolute;
            bottom: -18px;
            left: 0;
            font-size: 0.75rem;
            display: none;
        }
        .status-msg.error {
            color: #f93b3b;
            display: block;
        }
        .status-msg.success {
            color: #3bf973;
            display: block;
        }
        #email-group {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-bottom: 0;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
        }
        #email-group.show {
            max-height: 120px;
            opacity: 1;
            margin-bottom: 22px;
        }
        .action-btn {
            width: 100%;
            padding: 13px;
            background-color: #3b3bf9;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #3131d9;
        }
        .toggle-text {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #b3b3b9;
            text-align: center;
        }
        .toggle-text a {
            color: #3b3bf9;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .footer-links {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .footer-links a {
            color: #7b7b85;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="assets/Starfall.webp" alt="Starfall" class="logo">
            <span class="logo-title">Starfall</span>
        </div>
        
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username">
            <span class="status-msg" id="username-status"></span>
        </div>
        
        <div class="input-group" id="email-group">
            <label for="email">Email</label>
            <input type="email" id="email">
            <span class="status-msg" id="email-error">Invalid or non-existent email</span>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>

        <button class="action-btn" id="submit-btn">Log In</button>

        <div class="toggle-text" id="toggle-container">
            Don't have an account? <a id="toggle-link" href="#">Sign up</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Terms of Service</a>
    </div>

    <script>
        const submitBtn = document.getElementById('submit-btn');
        const emailGroup = document.getElementById('email-group');
        const toggleContainer = document.getElementById('toggle-container');
        const toggleLink = document.getElementById('toggle-link');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const usernameInput = document.getElementById('username');
        const usernameStatus = document.getElementById('username-status');

        let isLoginMode = true;

        function updateMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;

            emailInput.classList.remove('error', 'success');
            emailError.style.display = 'none';
            emailInput.value = '';
            
            usernameInput.classList.remove('error', 'success');
            usernameStatus.style.display = 'none';
            usernameInput.value = '';

            if (isLoginMode) {
                submitBtn.textContent = 'Log In';
                emailGroup.classList.remove('show');
                toggleContainer.innerHTML = 'Don\'t have an account? <a id="toggle-link" href="#">Sign up</a>';
            } else {
                submitBtn.textContent = 'Sign Up';
                emailGroup.classList.add('show');
                toggleContainer.innerHTML = 'Already have an account? <a id="toggle-link" href="#">Log in</a>';
            }

            document.getElementById('toggle-link').addEventListener('click', updateMode);
        }

        toggleLink.addEventListener('click', updateMode);

        // Проверка доступности юзернейма в реальном времени
        const takenUsernames = ['admin', 'user', 'root', 'starfall', 'test'];
        usernameInput.addEventListener('input', () => {
            const val = usernameInput.value.trim().toLowerCase();
            if (val.length === 0) {
                usernameInput.classList.remove('error', 'success');
                usernameStatus.style.display = 'none';
                return;
            }

            if (takenUsernames.includes(val)) {
                usernameInput.classList.add('error');
                usernameInput.classList.remove('success');
                usernameStatus.textContent = 'Username is already taken';
                usernameStatus.className = 'status-msg error';
            } else {
                usernameInput.classList.remove('error');
                usernameInput.classList.add('success');
                usernameStatus.textContent = 'Username is available';
                usernameStatus.className = 'status-msg success';
            }
        });

        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const usernameVal = usernameInput.value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            if (!isLoginMode) {
                const emailVal = emailInput.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const fakeMxBlocklist = ['test.com', 'fakemail.com', 'asdf.com', 'mailinator.com'];
                const domain = emailVal.split('@')[1];

                let hasError = false;

                if (!emailRegex.test(emailVal) || (domain && fakeMxBlocklist.includes(domain.toLowerCase()))) {
                    emailInput.classList.add('error');
                    emailError.style.display = 'block';
                    hasError = true;
                } else {
                    emailInput.classList.remove('error');
                    emailError.style.display = 'none';
                }

                if (usernameInput.classList.contains('error') || usernameVal === '') {
                    usernameInput.classList.add('error');
                    hasError = true;
                }

                if (!hasError && passwordVal !== '') {
                    window.location.href = 'starfall.html';
                }
            } else {
                if (usernameVal !== '' && passwordVal !== '') {
                    window.location.href = 'starfall.html';
                }
            }
        });
    </script>
</body>
</html>
