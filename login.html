<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall</title>
    <style>
        body {
            background-color: #18181f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            position: relative;
        }
        .container {
            width: 410px;
            background-color: #22222b;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 35px 25px 25px 25px;
            box-sizing: border-box;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo {
            width: 75px;
            height: 75px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .logo-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 22px;
            transition: all 0.3s ease;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: #b3b3b9;
        }
        .input-group input {
            width: 100%;
            padding: 11px;
            background-color: #18181f !important;
            border: 1px solid #33333d;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #555566;
        }
        .input-group input.error {
            border-color: #f93b3b;
        }
        .input-group input.success {
            border-color: #3bf973;
        }
        .status-msg {
            position: absolute;
            bottom: -18px;
            left: 0;
            font-size: 0.75rem;
            display: none;
        }
        .status-msg.error {
            color: #f93b3b;
            display: block;
        }
        .status-msg.success {
            color: #3bf973;
            display: block;
        }
        #email-group {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-bottom: 0;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
        }
        #email-group.show {
            max-height: 120px;
            opacity: 1;
            margin-bottom: 22px;
        }
        .action-btn {
            width: 100%;
            padding: 13px;
            background-color: #3b3bf9;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #3131d9;
        }
        .toggle-text {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #b3b3b9;
            text-align: center;
            cursor: pointer;
            user-select: none;
            padding: 5px;
        }
        .toggle-text span {
            color: #3b3bf9;
            font-weight: bold;
            text-decoration: underline;
        }
        .toggle-text:hover span {
            color: #3131d9;
        }
        .footer-links {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .footer-links a {
            color: #7b7b85;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="assets/Starfall.webp" alt="Starfall" class="logo">
            <span class="logo-title">Starfall</span>
        </div>
        
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username">
            <span class="status-msg" id="username-status"></span>
        </div>
        
        <div class="input-group" id="email-group">
            <label for="email">Email</label>
            <input type="email" id="email">
            <span class="status-msg" id="email-error">Invalid email format</span>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>

        <button class="action-btn" id="submit-btn">Log In</button>

        <div class="toggle-text" id="toggle-container">
            Don't have an account? <span id="toggle-action">Sign up</span>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Terms of Service</a>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@libsql/client@0.14.0";

        // Замени на свои реальные данные Turso
        const db = createClient({
            url: "ТВОЙ_TURSO_URL",
            authToken: "ТВОЙ_TURSO_TOKEN"
        });

        async function initDB() {
            try {
                await db.execute(`
                    CREATE TABLE IF NOT EXISTS users (
                        id INTEGER PRIMARY KEY AUTOINCREMENT,
                        username TEXT UNIQUE NOT NULL,
                        email TEXT,
                        password TEXT NOT NULL
                    )
                `);
            } catch (err) {
                console.error("DB init error:", err);
            }
        }
        initDB();

        const submitBtn = document.getElementById('submit-btn');
        const emailGroup = document.getElementById('email-group');
        const toggleContainer = document.getElementById('toggle-container');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const usernameInput = document.getElementById('username');
        const usernameStatus = document.getElementById('username-status');

        let isLoginMode = true;

        // Надежное переключение режимов по клику
        toggleContainer.addEventListener('click', () => {
            isLoginMode = !isLoginMode;

            emailInput.classList.remove('error', 'success');
            emailError.style.display = 'none';
            emailInput.value = '';
            
            usernameInput.classList.remove('error', 'success');
            usernameStatus.style.display = 'none';
            usernameInput.value = '';

            if (isLoginMode) {
                submitBtn.textContent = 'Log In';
                emailGroup.classList.remove('show');
                toggleContainer.innerHTML = 'Don\'t have an account? <span id="toggle-action">Sign up</span>';
            } else {
                submitBtn.textContent = 'Sign Up';
                emailGroup.classList.add('show');
                toggleContainer.innerHTML = 'Already have an account? <span id="toggle-action">Log in</span>';
            }
        });

        // Проверка доступности ника в реальном времени
        usernameInput.addEventListener('input', async () => {
            const val = usernameInput.value.trim();
            if (val.length === 0 || isLoginMode) {
                usernameInput.classList.remove('error', 'success');
                usernameStatus.style.display = 'none';
                return;
            }

            try {
                const result = await db.execute({
                    sql: 'SELECT * FROM users WHERE username = ?',
                    args: [val]
                });

                if (result.rows.length > 0) {
                    usernameInput.classList.add('error');
                    usernameInput.classList.remove('success');
                    usernameStatus.textContent = 'Username is already taken';
                    usernameStatus.className = 'status-msg error';
                } else {
                    usernameInput.classList.remove('error');
                    usernameInput.classList.add('success');
                    usernameStatus.textContent = 'Username is available';
                    usernameStatus.className = 'status-msg success';
                }
            } catch (err) {
                console.error(err);
            }
        });

        // Обработка кнопки Входа / Регистрации
        submitBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const usernameVal = usernameInput.value.trim();
            const passwordVal = document.getElementById('password').value.trim();

            if (!usernameVal || !passwordVal) {
                alert('Please fill in all fields');
                return;
            }

            if (!isLoginMode) {
                const emailVal = emailInput.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailRegex.test(emailVal)) {
                    emailInput.classList.add('error');
                    emailError.style.display = 'block';
                    return;
                } else {
                    emailInput.classList.remove('error');
                    emailError.style.display = 'none';
                }

                try {
                    await db.execute({
                        sql: 'INSERT INTO users (username, email, password) VALUES (?, ?, ?)',
                        args: [usernameVal, emailVal, passwordVal]
                    });
                    window.location.href = 'starfall.html';
                } catch (err) {
                    alert('Registration error: Username or email already exists');
                }
            } else {
                try {
                    const result = await db.execute({
                        sql: 'SELECT * FROM users WHERE username = ? AND password = ?',
                        args: [usernameVal, passwordVal]
                    });

                    if (result.rows.length > 0) {
                        window.location.href = 'starfall.html';
                    } else {
                        alert('Invalid username or password');
                    }
                } catch (err) {
                    alert('Login error');
                }
            }
        });
    </script>
</body>
</html>
