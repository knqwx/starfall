<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall</title>
    <style>
        body {
            background-color: #18181f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 360px;
            background-color: #22222b;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 30px 20px 20px 20px;
            box-sizing: border-box;
        }
        .logo {
            width: 50px;
            height: 50px;
            margin-bottom: 25px;
            object-fit: contain;
        }
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #b3b3b9;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #18181f;
            border: 1px solid #33333d;
            border-radius: 4px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #555566;
        }
        .action-btn {
            width: 100%;
            padding: 10px;
            background-color: #3b3bf9;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .action-btn:hover {
            background-color: #3131d9;
        }
        .toggle-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #b3b3b9;
            text-align: center;
        }
        .toggle-text a {
            color: #3b3bf9;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .footer-links {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .footer-links a {
            color: #7b7b85;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="assets/Starfall.webp" alt="Starfall" class="logo">
        
        <!-- Поля формы -->
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username">
        </div>
        
        <!-- Дополнительное поле для регистрации (изначально скрыто) -->
        <div class="input-group" id="email-group" style="display: none;">
            <label for="email">Email</label>
            <input type="email" id="email">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>

        <button class="action-btn" id="submit-btn">Log In</button>

        <div class="toggle-text" id="toggle-container">
            Don't have an account? <a id="toggle-link">Sign up</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Terms of Service</a>
    </div>

    <script>
        const submitBtn = document.getElementById('submit-btn');
        const emailGroup = document.getElementById('email-group');
        const toggleContainer = document.getElementById('toggle-container');
        const toggleLink = document.getElementById('toggle-link');

        let isLoginMode = true;

        toggleLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;

            if (isLoginMode) {
                // Переключение на Вход
                submitBtn.textContent = 'Log In';
                emailGroup.style.display = 'none';
                toggleContainer.innerHTML = 'Don\'t have an account? <a id="toggle-link" href="#">Sign up</a>';
            } else {
                // Переключение на Регистрацию
                submitBtn.textContent = 'Sign Up';
                emailGroup.style.display = 'block';
                toggleContainer.innerHTML = 'Already have an account? <a id="toggle-link" href="#">Log in</a>';
            }

            // Перепривязываем слушатель событий к новому созданному элементу ссылки
            document.getElementById('toggle-link').addEventListener('click', (e) => {
                e.preventDefault();
                toggleLink.click(); // Повторный вызов логики
            });
        });

        // Предотвращаем перезагрузку при клике на созданную ссылку через JS
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'toggle-link') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
