<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall</title>
    <style>
        body {
            background-color: #18181f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            position: relative;
        }
        .container {
            width: 410px;
            background-color: #22222b;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 35px 25px 25px 25px;
            box-sizing: border-box;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo {
            width: 75px;
            height: 75px;
            margin-bottom: 8px;
            object-fit: contain;
        }
        .logo-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 22px;
            transition: all 0.3s ease;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: #b3b3b9;
        }
        .input-group input {
            width: 100%;
            padding: 11px;
            background-color: #18181f !important;
            border: 1px solid #33333d;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #555566;
        }
        .input-group input.error {
            border-color: #f93b3b;
        }
        .input-group input.success {
            border-color: #3bf973;
        }
        .status-msg {
            position: absolute;
            bottom: -18px;
            left: 0;
            font-size: 0.75rem;
            display: none;
        }
        .status-msg.error {
            color: #f93b3b;
            display: block;
        }
        .status-msg.success {
            color: #3bf973;
            display: block;
        }
        #email-group {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-bottom: 0;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
        }
        #email-group.show {
            max-height: 120px;
            opacity: 1;
            margin-bottom: 22px;
        }
        .action-btn {
            width: 100%;
            padding: 13px;
            background-color: #3b3bf9;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #3131d9;
        }
        .toggle-text {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #b3b3b9;
            text-align: center;
            user-select: none;
            padding: 5px;
        }
        .toggle-action,
        #toggle-action {
            appearance: none;
            -webkit-appearance: none;
            display: inline;
            border: 0;
            background: transparent;
            color: #7777ff;
            font: inherit;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            cursor: pointer;
            padding: 2px 3px;
            opacity: 1;
            visibility: visible;
        }
        .toggle-action:hover,
        #toggle-action:hover {
            color: #a0a0ff;
        }
        .toggle-action:focus-visible,
        #toggle-action:focus-visible {
            outline: 2px solid #7777ff;
            outline-offset: 3px;
            border-radius: 3px;
        }
        .toggle-action:disabled,
        #toggle-action:disabled {
            color: #7777ff;
            opacity: 1;
        }
        .footer-links {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .footer-links a {
            color: #7b7b85;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="assets/Starfall.webp" alt="Starfall" class="logo">
            <span class="logo-title">Starfall</span>
        </div>
        
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username">
            <span class="status-msg" id="username-status"></span>
        </div>
        
        <div class="input-group" id="email-group">
            <label for="email">Email</label>
            <input type="email" id="email">
            <span class="status-msg" id="email-error">Invalid email format</span>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>

        <button class="action-btn" id="submit-btn">Log In</button>

        <div class="toggle-text" id="toggle-container">
            <span id="toggle-prompt">Don't have an account?</span>
            <button class="toggle-action" id="toggle-action" type="button">Sign up</button>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Terms of Service</a>
    </div>

    <script type="module">
        // Authentication must go through the Starfall backend. Never put Turso
        // credentials in browser code. These endpoints must be implemented server-side.
        // If this page is opened from Render itself, use same-origin; otherwise
        // (e.g. GitHub Pages) talk to the Render backend.
        const RENDER_API = 'https://starfall-rejh.onrender.com';
        const API_BASE = window.STARFALL_API_BASE ||
            (location.hostname.endsWith('onrender.com') ? '' : RENDER_API);

        const submitBtn = document.getElementById('submit-btn');
        const emailGroup = document.getElementById('email-group');
        const toggleContainer = document.getElementById('toggle-container');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const usernameInput = document.getElementById('username');
        const usernameStatus = document.getElementById('username-status');

        let isLoginMode = true;

        const togglePrompt = document.getElementById('toggle-prompt');

        // Only the actual button toggles modes. Delegation keeps the handler
        // working even if the button's text changes.
        toggleContainer.addEventListener('click', (event) => {
            const button = event.target.closest('#toggle-action');
            if (!button || !toggleContainer.contains(button)) return;

            event.preventDefault();
            isLoginMode = !isLoginMode;

            emailInput.classList.remove('error', 'success');
            emailError.style.display = 'none';
            emailInput.value = '';

            usernameInput.classList.remove('error', 'success');
            usernameStatus.style.display = 'none';
            usernameStatus.textContent = '';

            if (isLoginMode) {
                submitBtn.textContent = 'Log In';
                emailGroup.classList.remove('show');
                togglePrompt.textContent = "Don't have an account?";
                button.textContent = 'Sign up';
            } else {
                submitBtn.textContent = 'Sign Up';
                emailGroup.classList.add('show');
                togglePrompt.textContent = 'Already have an account?';
                button.textContent = 'Log in';
            }

            button.className = 'toggle-action';
            button.type = 'button';
        });

        // Username availability check (only if the backend exposes this endpoint).
        let availabilityRequest = 0;
        usernameInput.addEventListener('input', async () => {
            const val = usernameInput.value.trim();
            const requestId = ++availabilityRequest;

            if (val.length === 0 || isLoginMode) {
                usernameInput.classList.remove('error', 'success');
                usernameStatus.style.display = 'none';
                usernameStatus.textContent = '';
                return;
            }

            // Avoid treating an unavailable endpoint as proof that a username is free.
            try {
                const response = await fetch(`${API_BASE}/api/auth/check-username?username=${encodeURIComponent(val)}`, {
                    headers: { 'Accept': 'application/json' }
                });
                if (requestId !== availabilityRequest) return;
                if (!response.ok) throw new Error('Username availability check failed');

                const data = await response.json();
                const available = data.available === true;
                usernameInput.classList.toggle('error', !available);
                usernameInput.classList.toggle('success', available);
                usernameStatus.textContent = available ? 'Username is available' : 'Username is already taken';
                usernameStatus.className = `status-msg ${available ? 'success' : 'error'}`;
            } catch (err) {
                if (requestId !== availabilityRequest) return;
                usernameInput.classList.remove('error', 'success');
                usernameStatus.style.display = 'none';
                console.warn('Username availability check unavailable:', err);
            }
        });

        // Submit to the backend so account creation uses the same database and
        // secure password/session handling as the rest of Starfall.
        submitBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const usernameVal = usernameInput.value.trim();
            const passwordVal = document.getElementById('password').value;
            const emailVal = emailInput.value.trim();

            if (!usernameVal || !passwordVal || (!isLoginMode && !emailVal)) {
                alert('Please fill in all required fields');
                return;
            }
            if (!isLoginMode) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(emailVal)) {
                    emailInput.classList.add('error');
                    emailError.style.display = 'block';
                    return;
                }
                emailInput.classList.remove('error');
                emailError.style.display = 'none';
            }

            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            const payload = isLoginMode
                ? { username: usernameVal, password: passwordVal }
                : { username: usernameVal, email: emailVal, password: passwordVal };

            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = isLoginMode ? 'Logging in…' : 'Creating account…';

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const rawText = await response.text();
                let data = {};
                try { data = JSON.parse(rawText); } catch (_) {}

                if (!response.ok) {
                    // DEBUG: показываем технические детали (удобно на телефоне)
                    alert(
                        'DEBUG\n' +
                        'URL: ' + response.url + '\n' +
                        'Status: ' + response.status + '\n' +
                        'Content-Type: ' + (response.headers.get('content-type') || '-') + '\n' +
                        'Body: ' + rawText.slice(0, 300)
                    );
                    if (response.status === 409) {
                        alert(data.error || 'Username already exists');
                    } else if (response.status === 400) {
                        alert(data.error || 'Please check the information you entered');
                    } else if (response.status === 404) {
                        alert('The authentication endpoint is not configured on the Starfall server yet. Account creation cannot work until the backend register/login routes are added.');
                    } else {
                        alert(data.error || (isLoginMode ? 'Login failed' : 'Registration failed'));
                    }
                    return;
                }

                if (data.success === false) {
                    alert(data.error || (isLoginMode ? 'Login failed' : 'Registration failed'));
                    return;
                }

                window.location.href = 'starfall.html';
            } catch (err) {
                console.error('Authentication request failed:', err);
                // DEBUG
                alert('DEBUG network error\nURL: ' + API_BASE + endpoint + '\npage: ' + location.href + '\n' + (err && err.message ? err.message : err));
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
