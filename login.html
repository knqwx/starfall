<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall</title>
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background-color: #18181f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px 16px 90px;
            display: flex;
            overflow-x: hidden;
        }
        /* auto margins centre the card without ever pushing its top off-screen on small or zoomed screens */
        .container {
            width: min(410px, 100%);
            margin: auto;
            background-color: #22222b;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 35px clamp(16px, 6vw, 25px) 25px;
        }
        .logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .logo { width: 75px; height: 75px; margin-bottom: 8px; object-fit: contain; }
        .logo-title { font-size: 1.25rem; font-weight: bold; letter-spacing: 0.5px; }

        #auth-form { width: 100%; }
        .email-input-group { margin-bottom: 0; }
        .error-message {
            width: 100%;
            display: none;
            color: #ff6b6b;
            font-size: 0.8rem;
            text-align: center;
            line-height: 1.4;
            overflow-wrap: anywhere;
            background: rgba(249, 59, 59, 0.1);
            border: 1px solid rgba(249, 59, 59, 0.25);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 16px;
        }

        .input-group { width: 100%; margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: #b3b3b9; }
        .input-group input[type="text"],
        .input-group input[type="email"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 11px;
            background-color: #18181f;
            border: 1px solid #33333d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
        }
        .input-group input:focus { outline: none; border-color: #555566; }
        .field-status { font-size: 0.75rem; margin-top: 5px; min-height: 14px; color: #8a8a94; overflow-wrap: anywhere; }
        .field-status.ok { color: #3bf973; }
        .field-status.bad { color: #f93b3b; }

        /* sections that only exist while signing up */
        .signup-only { width: 100%; max-height: 0; opacity: 0; overflow: hidden; margin: 0; pointer-events: none;
            transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.35s ease; }
        .signup-only.show { max-height: 460px; opacity: 1; margin-bottom: 18px; pointer-events: auto; }
        .signup-only.field.show { max-height: 140px; }

        .pw-bar { height: 6px; background: #18181f; border-radius: 6px; overflow: hidden; border: 1px solid #33333d; }
        .pw-bar-fill { height: 100%; width: 0%; background: #f93b3b; transition: width 0.25s ease, background-color 0.25s ease; }
        .pw-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: #b3b3b9; margin: 6px 0 8px; }
        .pw-rules { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 0.72rem; color: #7b7b85; }
        .pw-rules li::before { content: '\2715'; display: inline-block; width: 14px; color: #f93b3b; }
        .pw-rules li.ok { color: #cfcfd6; }
        .pw-rules li.ok::before { content: '\2713'; color: #3bf973; }
        .age-check { display: flex; gap: 8px; align-items: flex-start; color: #b3b3b9; font-size: 0.8rem; line-height: 1.4; cursor: pointer; }
        .age-check input { margin-top: 2px; accent-color: #3b3bf9; }

        .captcha-box { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .captcha-question { background: #18181f; border: 1px solid #33333d; border-radius: 6px; padding: 11px 14px; color: #7777ff; font-weight: bold; white-space: nowrap; user-select: none; }
        .captcha-box input { flex: 1 1 110px; min-width: 0; }

        .action-btn {
            width: 100%;
            padding: 13px;
            background-color: #3b3bf9;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s;
        }
        .action-btn:hover { background-color: #3131d9; }
        .action-btn:disabled { opacity: 0.7; cursor: default; }
        .toggle-text { margin-top: 18px; font-size: 0.9rem; color: #b3b3b9; text-align: center; user-select: none; padding: 5px; }
        .toggle-action {
            appearance: none; -webkit-appearance: none; border: 0; background: transparent;
            color: #7777ff; font: inherit; font-weight: bold; text-decoration: underline; cursor: pointer; padding: 2px 3px;
        }
        .toggle-action:hover { color: #a0a0ff; }
        .toggle-action:focus-visible { outline: 2px solid #7777ff; outline-offset: 3px; border-radius: 3px; }

        .footer-links { position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; align-items: center; white-space: nowrap; }
        .footer-links a { color: #7b7b85; text-decoration: none; font-size: 0.95rem; }
        .footer-links a:hover { color: #ffffff; }

        .redirect-loading { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px; padding: 24px; background: rgba(24, 24, 31, .97); text-align: center; }
        .redirect-loading.active { display: flex; }
        .redirect-spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #33333d; border-top-color: #3b3bf9; animation: spin .8s linear infinite; }
        .redirect-loading span { color: #9a9aa5; font-size: 0.85rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 360px) { .pw-rules { grid-template-columns: 1fr; } }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .redirect-spinner { animation-duration: 2s; } }
    </style>
</head>
<body>

    <div class="redirect-loading" id="redirect-loading" role="status" aria-live="polite">
        <div class="redirect-spinner" aria-hidden="true"></div>
        <strong id="loading-title">Signing you in…</strong>
        <span>The server may need a few seconds to wake up.</span>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="assets/Starfall.webp" alt="Starfall" class="logo">
            <span class="logo-title">Starfall</span>
        </div>

        <div class="error-message" id="error-msg" role="alert"></div>

        <form id="auth-form" novalidate>
            <div class="input-group">
                <label for="main-input" id="main-label">Username or email</label>
                <input type="text" id="main-input" autocomplete="username" autocapitalize="none" spellcheck="false">
                <div class="field-status" id="username-status"></div>
            </div>

            <div class="signup-only field" id="email-group">
                <div class="input-group email-input-group">
                    <label for="email-input">Email</label>
                    <input type="email" id="email-input" autocomplete="email" autocapitalize="none" spellcheck="false">
                    <div class="field-status" id="email-status"></div>
                </div>
            </div>

            <div class="input-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" autocomplete="current-password">
            </div>

            <button type="submit" class="action-btn" id="submit-btn">Log In</button>

            <div class="toggle-text">
                <span id="toggle-prompt">Don't have an account?</span>
                <button class="toggle-action" id="toggle-btn" type="button">Sign up</button>
            </div>
        </form>
    </div>

    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Terms of Service</a>
    </div>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const mainLabel = $('main-label'), mainInput = $('main-input'), emailInput = $('email-input'),
          passwordInput = $('password-input'),
          submitBtn = $('submit-btn'), togglePrompt = $('toggle-prompt'), toggleBtn = $('toggle-btn'),
          authForm = $('auth-form'), errorMsg = $('error-msg'), usernameStatus = $('username-status'), emailStatus = $('email-status'),
          loading = $('redirect-loading');

    let isLoginMode = true, busy = false;

    // ===== API helper =====
    // Served by the backend on the same origin; sessions stay in HttpOnly cookies.
    const API_BASE = '';

    async function api(path, body) {
        const headers = { 'Accept': 'application/json' };
        const opts = { cache: 'no-store', headers };
        if (body !== undefined) {
            opts.method = 'POST';
            headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        try {
            opts.credentials = 'same-origin';
            const r = await fetch(API_BASE + path, opts);
            let data = {};
            try { data = await r.json(); } catch (e) {}
            return { ok: r.ok, status: r.status, data: data || {} };
        } catch (e) {
            return { ok: false, status: 0, data: { error: 'Cannot reach the server. Check your connection and try again. (' + (e && e.message ? e.message : 'network error') + ')' } };
        }
    }

    function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }

    // ===== Login / sign-up mode =====
    function setStatus(el, cls, text) { el.className = 'field-status ' + cls; el.textContent = text; }
    function setMode(loginMode) {
        isLoginMode = loginMode;
        errorMsg.style.display = 'none';
        setStatus(usernameStatus, '', ''); setStatus(emailStatus, '', '');
        $('email-group').classList.toggle('show', !loginMode);
        if (loginMode) {
            mainLabel.textContent = 'Username or email';
            submitBtn.textContent = 'Log In';
            passwordInput.autocomplete = 'current-password';
            togglePrompt.textContent = "Don't have an account?";
            toggleBtn.textContent = 'Sign up';
        } else {
            mainLabel.textContent = 'Username';
            submitBtn.textContent = 'Sign Up';
            passwordInput.autocomplete = 'new-password';
            togglePrompt.textContent = 'Already have an account?';
            toggleBtn.textContent = 'Log in';
            if (mainInput.value.trim()) runUsernameCheck();
            if (emailInput.value.trim()) runEmailCheck();
        }
    }
    toggleBtn.addEventListener('click', () => { userSeq++; emailSeq++; setMode(!isLoginMode); });
    if (new URLSearchParams(location.search).get('mode') === 'signup') setMode(false);

    // ===== Live availability checks (sign-up only) =====
    let userSeq = 0, emailSeq = 0, userTimer = null, emailTimer = null;
    async function runUsernameCheck() {
        const seq = ++userSeq, name = mainInput.value.trim();
        if (isLoginMode || !name) { setStatus(usernameStatus, '', ''); return; }
        setStatus(usernameStatus, '', 'Checking...');
        const r = await api('/api/check-username?name=' + encodeURIComponent(name));
        if (seq !== userSeq) return;
        if (!r.ok) { setStatus(usernameStatus, '', ''); return; }
        setStatus(usernameStatus, r.data.ok ? 'ok' : 'bad', r.data.message || '');
    }
    async function runEmailCheck() {
        const seq = ++emailSeq, email = emailInput.value.trim().toLowerCase();
        if (isLoginMode || !email) { setStatus(emailStatus, '', ''); return; }
        if (!email.includes('@') || email.endsWith('@')) { setStatus(emailStatus, '', 'Keep typing your email...'); return; }
        setStatus(emailStatus, '', 'Checking...');
        const r = await api('/api/check-email?email=' + encodeURIComponent(email));
        if (seq !== emailSeq) return;
        if (!r.ok) { setStatus(emailStatus, '', ''); return; }
        setStatus(emailStatus, r.data.ok ? 'ok' : 'bad', r.data.message || '');
    }
    mainInput.addEventListener('input', () => {
        if (isLoginMode) return;
        clearTimeout(userTimer);
        setStatus(usernameStatus, '', mainInput.value.trim() ? 'Checking...' : '');
        userTimer = setTimeout(runUsernameCheck, 450);
    });
    emailInput.addEventListener('input', () => {
        if (isLoginMode) return;
        clearTimeout(emailTimer);
        emailTimer = setTimeout(runEmailCheck, 600);
    });

    // ===== Submit =====
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (busy) return;
        errorMsg.style.display = 'none';

        const password = passwordInput.value;
        let result, redirecting = false;
        busy = true;
        submitBtn.disabled = true;
        try {
            if (!isLoginMode) {
                const username = mainInput.value.trim(), email = emailInput.value.trim().toLowerCase();
                if (!username || !email || !password) { showError('Please fill in all fields.'); return; }
                if (new TextEncoder().encode(password).length < 8) { showError('Password must be at least 8 bytes long.'); return; }
                if (new TextEncoder().encode(password).length > 1024) { showError('Password is too long (maximum 1024 bytes).'); return; }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showError('Please enter a valid email address.'); return; }
                $('loading-title').textContent = 'Creating your account…';
                loading.classList.add('active');
                submitBtn.textContent = 'Creating account…';
                result = await api('/api/signup', { username, email, password });
            } else {
                const id = mainInput.value.trim();
                if (!id || !password) { showError('Please fill in all fields.'); return; }
                $('loading-title').textContent = 'Signing you in…';
                loading.classList.add('active');
                submitBtn.textContent = 'Logging in…';
                result = await api('/api/login', { id, password });
            }

            if (!result.ok) {
                loading.classList.remove('active');
                let msg = result.data.error || 'Something went wrong. Try again.';
                showError(msg);
                return;
            }
            redirecting = true;
            submitBtn.textContent = 'Opening Starfall…';
            window.location.href = 'starfall.html';
        } catch (err) {
            loading.classList.remove('active');
            showError('Could not reach the server. Please try again.');
        } finally {
            busy = false;
            if (!redirecting) {
                loading.classList.remove('active');
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? 'Log In' : 'Sign Up';
            }
        }
    });
})();
</script>
</body>
</html>
