<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfall</title>
    <style>
        body {
            background-color: #18181f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            position: relative;
        }
        .container {
            width: 440px;
            background-color: #22222b;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 40px 30px 30px 30px;
            box-sizing: border-box;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 30px;
            object-fit: contain;
        }
        .input-group {
            width: 100%;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #b3b3b9;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #18181f;
            border: 1px solid #33333d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1rem;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #555566;
        }
        #email-group {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-bottom: 0;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
        }
        #email-group.show {
            max-height: 120px;
            opacity: 1;
            margin-bottom: 20px;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: #3b3bf9;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #3131d9;
        }
        .toggle-text {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #b3b3b9;
            text-align: center;
        }
        .toggle-text a {
            color: #3b3bf9;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .footer-links {
            position: absolute;
            bottom: 25px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-links a {
            color: #7b7b85;
            text-decoration: none;
            font-size: 1rem;
        }
        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="assets/Starfall.webp" alt="Starfall" class="logo">
        
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username">
        </div>
        
        <div class="input-group" id="email-group">
            <label for="email">Email</label>
            <input type="email" id="email">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>

        <button class="action-btn" id="submit-btn">Log In</button>

        <div class="toggle-text" id="toggle-container">
            Don't have an account? <a id="toggle-link" href="#">Sign up</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Terms of Service</a>
    </div>

    <script>
        const submitBtn = document.getElementById('submit-btn');
        const emailGroup = document.getElementById('email-group');
        const toggleContainer = document.getElementById('toggle-container');
        const toggleLink = document.getElementById('toggle-link');

        let isLoginMode = true;

        function updateMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;

            if (isLoginMode) {
                submitBtn.textContent = 'Log In';
                emailGroup.classList.remove('show');
                toggleContainer.innerHTML = 'Don\'t have an account? <a id="toggle-link" href="#">Sign up</a>';
            } else {
                submitBtn.textContent = 'Sign Up';
                emailGroup.classList.add('show');
                toggleContainer.innerHTML = 'Already have an account? <a id="toggle-link" href="#">Log in</a>';
            }

            document.getElementById('toggle-link').addEventListener('click', updateMode);
        }

        toggleLink.addEventListener('click', updateMode);
    </script>
</body>
</html>
